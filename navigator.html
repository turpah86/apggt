<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Навигатор ГГТ | Гид первокурсника</title>
  <style>
    :root {
      --gold: #ffd700;
      --gold-hover: #ffecb3;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      padding-bottom: 85px; /* Место под нижнее стеклянное меню */
    }

    .background-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      z-index: -1;
    }

    /* Компактная шапка */
    .top-bar {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .badge-gold {
      background: var(--gold);
      color: #000;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Стеклянные карточки в стиле сайта */
    .glass-card {
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 18px;
    }

    /* Поле поиска */
    .search-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      margin-bottom: 14px;
    }

    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
    }

    /* Кнопки выбора этажей */
    .floors {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .floor-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .floor-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .floor-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
    }

    /* Интерактивная SVG-карта */
    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .corridor {
      fill: rgba(255, 255, 255, 0.03);
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1.5;
    }

    .room {
      fill: rgba(30, 41, 59, 0.9);
      stroke: rgba(255, 255, 255, 0.25);
      stroke-width: 1.5;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .room:hover {
      stroke: var(--gold);
      fill: rgba(255, 215, 0, 0.15);
    }

    .room.highlighted {
      fill: rgba(255, 215, 0, 0.28);
      stroke: var(--gold);
      stroke-width: 2.5;
    }

    .room-label {
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
      pointer-events: none;
      text-anchor: middle;
    }

    .corridor-label {
      font-size: 12px;
      fill: rgba(255, 255, 255, 0.45);
      pointer-events: none;
      text-anchor: middle;
    }

    .here-pin { display: none; }
    .here-pin.visible { display: block; }

    /* Карточка выбранного кабинета */
    .info-card {
      display: none;
      border-color: rgba(255, 215, 0, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .info-card.visible { display: block; animation: fadeIn 0.25s ease; }

    .info-title {
      color: var(--gold);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .info-desc {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    /* Чек-лист первокурсника */
    .card-heading {
      color: var(--gold);
      font-size: 1.15rem;
      margin-bottom: 14px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--glass-border);
      cursor: pointer;
      font-size: 0.95rem;
    }
    .checklist-item:last-child { border-bottom: none; }

    .checklist-item input {
      width: 20px;
      height: 20px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .checklist-item.done span {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.35);
    }

    /* Теги в памятке */
    .tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .tag-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.85rem;
      color: var(--gold);
    }

    /* Нижнее меню навигации */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      height: 68px;
      z-index: 1000;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }

    .nav-btn.active {
      color: var(--gold);
    }

    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>

<div class="background-overlay"></div>

<header class="top-bar">
  <div class="top-bar-title">Навигатор <span style="color: var(--gold);">ГГТ</span></div>
  <span class="badge-gold">п. Хандыга</span>
</header>

<div class="container">
  <!-- ВКЛАДКА 1: КАРТА КОРПУСА -->
  <div id="tab-map" class="tab-content active">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск аудитории (например: 101, Библиотека)...">

    <div class="floors">
      <button class="floor-btn active" onclick="switchFloor(1)">1 этаж</button>
      <button class="floor-btn" onclick="switchFloor(2)">2 этаж</button>
      <button class="floor-btn" onclick="switchFloor(3)">3 этаж</button>
    </div>

    <div class="glass-card">
      <!-- 1 ЭТАЖ -->
      <svg id="floor-1" viewBox="0 0 400 220">
        <rect class="corridor" x="10" y="80" width="380" height="60" rx="6" />
        <text x="200" y="114" class="corridor-label">Главный коридор • 1 этаж</text>

        <rect id="room-101" class="room" x="10" y="10" width="115" height="65" rx="8" onclick="selectRoom('101')" />
        <text x="67" y="47" class="room-label">Каб. 101</text>

        <rect id="room-102" class="room" x="135" y="10" width="130" height="65" rx="8" onclick="selectRoom('102')" />
        <text x="200" y="47" class="room-label">Учебная часть</text>

        <rect id="room-103" class="room" x="275" y="10" width="115" height="65" rx="8" onclick="selectRoom('103')" />
        <text x="332" y="47" class="room-label">Столовая</text>

        <!-- Вход -->
        <rect x="160" y="145" width="80" height="42" rx="8" fill="rgba(255, 215, 0, 0.15)" stroke="#ffd700" stroke-width="1.5" />
        <text x="200" y="170" class="room-label" style="fill: #ffd700;">ВХОД</text>

        <!-- Метка "Вы здесь" (?here=vhod) -->
        <g id="pin-vhod" class="here-pin">
          <circle cx="200" cy="126" r="7" fill="#ff4d4d" />
          <text x="200" y="108" font-size="11" font-weight="bold" fill="#ff4d4d" text-anchor="middle">ВЫ ЗДЕСЬ</text>
        </g>
      </svg>

      <!-- 2 ЭТАЖ -->
      <svg id="floor-2" viewBox="0 0 400 220" style="display:none;">
        <rect class="corridor" x="10" y="80" width="380" height="60" rx="6" />
        <text x="200" y="114" class="corridor-label">Коридор • 2 этаж</text>

        <rect id="room-201" class="room" x="10" y="10" width="185" height="65" rx="8" onclick="selectRoom('201')" />
        <text x="102" y="47" class="room-label">Каб. 201 (Спецдисциплины)</text>

        <rect id="room-202" class="room" x="205" y="10" width="185" height="65" rx="8" onclick="selectRoom('202')" />
        <text x="297" y="47" class="room-label">Библиотека</text>
      </svg>

      <!-- 3 ЭТАЖ -->
      <svg id="floor-3" viewBox="0 0 400 220" style="display:none;">
        <rect class="corridor" x="10" y="80" width="380" height="60" rx="6" />
        <text x="200" y="114" class="corridor-label">Коридор • 3 этаж</text>

        <rect id="room-301" class="room" x="10" y="10" width="380" height="65" rx="8" onclick="selectRoom('301')" />
        <text x="200" y="47" class="room-label">Каб. 301 • Компьютерный класс</text>
      </svg>
    </div>

    <!-- Карточка с описанием аудитории -->

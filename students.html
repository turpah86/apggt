<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <!-- 1. Сначала стили -->
    <link rel="stylesheet" href="style.css">
    <!-- 2. Библиотека Supabase (самая первая среди скриптов) -->
    <script src="supabase.js"></script>
    <!-- 3. Твой конфиг, который использует библиотеку -->
    <script src="config.js"></script>
    <!-- 4. Остальное -->
    <script src="navbar.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .main-centered {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            padding: 20px;
            box-sizing: border-box;
        }
        .glass-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            z-index: 10;
        }
        .auth-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .privacy-link {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .privacy-link:hover {
            opacity: 1 !important;
            border-bottom-color: #ffd700;
        }
    </style>
</head>
<body class="main-centered">
    <div class="background-overlay"></div>
    <div class="glass-card fadeInUp">
        <h2 style="margin-bottom: 30px; color: #ffd700;">Авторизация</h2>
        <div class="auth-container">
            <input type="text" id="login" class="pass-input" placeholder="Логин (Группа)" style="width: 100%; box-sizing: border-box;">
            <input type="password" id="pass" class="pass-input" placeholder="Пароль" style="width: 100%; box-sizing: border-box;">
            <button onclick="handlelogin()" class="btn-primary" style="width: 100%; margin-top: 10px;">Войти</button>
        </div>
        <p id="error" style="color: #ff6b6b; display: none; margin-top: 15px;">Ошибка доступа</p>
    </div>
    <footer style="z-index: 10;">
        <p style="text-align: center; margin-top: 60px; font-size: 0.7rem; opacity: 0.2; letter-spacing: 2px; color: white;">
            © 2026 PERMYAKOV DESIGN | 
            <a href="privacy.html" class="privacy-link">ПОЛИТИКА КОНФИДЕНЦИАЛЬНОСТИ</a>
        </p>
    </footer>

    <script>
    async function handlelogin() {
        const user = document.getElementById('login').value.trim().toLowerCase();
        const pass = document.getElementById('pass').value.trim();
        const errorEl = document.getElementById('error');
        errorEl.style.display = 'none';
    
        // 1. Проверка фиксированных групп (огр, рго, admin) из config.js
        if (typeof USERS !== 'undefined' && USERS[user] && USERS[user].password === pass) {
            localStorage.setItem('user_group', user);
            localStorage.setItem('access_' + USERS[user].redirect, 'true'); // Защита от вылета ОГР
            window.location.href = USERS[user].redirect;
            return;
        }
    
        // 2. Проверка студентов РЕМ (slesar1) через Supabase
        try {
            const S_URL = 'https://uqekwkidsuargeulwkuw.supabase.co';
            const S_KEY = 'sb_publishable_WefHBfPDA7Fx9ZDRMnZDUA_FfqINH2r';

            if (typeof supabase === 'undefined') {
                alert("Критическая ошибка: файл supabase.js не загрузился!");
                return;
            }
            
            const client = supabase.createClient(S_URL, S_KEY);
    
            // Ищем студента
            const { data: student, error } = await client
                .from('students')
                .select('*')
                .eq('login', user)
                .eq('password', pass)
                .maybeSingle();
    
            if (error) throw error;
    
            if (student) {
                // --- ВОЗВРАЩАЕМ ПРОВЕРКУ ДАТ КУРСА ---
                const { data: config } = await client
                    .from('course_config')
                    .select('*')
                    .eq('group_id', student.group_name)
                    .maybeSingle();
    
                if (config) {
                    const now = new Date();
                    if (now < new Date(config.start_date)) {
                        alert("Курс еще не начался. Старт: " + new Date(config.start_date).toLocaleDateString());
                        return;
                    }
                    if (now > new Date(config.end_date)) {
                        alert("Время обучения закончилось.");
                        return;
                    }
                }
                // -------------------------------------
    
                // Сохраняем сессию
                localStorage.setItem('student_login', student.login || user);
                localStorage.setItem('student_step', student.current_step || 1);
                localStorage.setItem('user_group', student.group_name || 'rem');
    
                window.location.href = 'rem_course.html';
            } else {
                errorEl.style.display = 'block';
                errorEl.innerText = 'Неверный логин или пароль';
            }
    
        } catch (e) {
            errorEl.style.display = 'block';
            errorEl.innerText = 'Ошибка базы данных. Проверьте консоль.';
            console.error("Детали:", e);
        }
    }
    </script>
</body>
</html>
